# 项目目录是中文名，compose 推导不出工程名，必须显式写
name: wn-workbench

services:
  web:
    build: .
    image: wn-workbench:latest
    container_name: wn-workbench
    restart: unless-stopped
    ports:
      - "${WB_PORT:-8765}:8765"
    volumes:
      # 库文件、归档、原始 json 都在宿主的 data/ 里，容器重建不丢
      - ./data:/data
    environment:
      # 留空则服务端自动生成随机口令，写在 data/.token 里
      WB_TOKEN: "${WB_TOKEN:-}"
      # 默认让容器自己采：起来就能看到数据，不用另开一台采集机。
      # 容器出不了公网时页面会提示「没能抓到数据」，也可以设成 0 改回只读看板，
      # 再用采集机推：python collector/api_rank.py --push http://这台机器:8765
      WB_ALLOW_COLLECT: "${WB_ALLOW_COLLECT:-1}"
      # 常驻巡检：每 6 小时看一眼，数据过期就补一轮（0 关闭）
      WB_COLLECT_EVERY: "${WB_COLLECT_EVERY:-6}"

# 项目目录是中文名，compose 推导不出工程名，必须显式写
name: wn-workbench

services:
  web:
    build: .
    image: wn-workbench:latest
    container_name: wn-workbench
    restart: unless-stopped
    ports:
      - "${WB_PORT:-8765}:8765"
    volumes:
      # 库文件、归档、原始 json 都在宿主的 data/ 里，容器重建不丢
      - ./data:/data
    environment:
      # 留空则服务端自动生成随机口令，写在 data/.token 里
      WB_TOKEN: "${WB_TOKEN:-}"
      # 部署形态下禁止从网页触发采集：服务器上没有模拟器
      WB_ALLOW_COLLECT: "0"
